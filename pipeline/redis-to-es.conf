#########################################################
# PIPELINE 2: Redis → Elasticsearch
#########################################################

input {
  redis {
    host => "redis"
    port => 6379
    password => "SuperSecret123"
    data_type => "list"
    key => "filebeat_queue"
    db => 0
    codec => "json"
  }
}

filter {
  # ✅ Parse nested JSON if message still wrapped
  if [message] {
    json {
      source => "message"
      target => "parsed_message"
      skip_on_invalid_json => true
    }
  }

  # ✅ Use log's actual timestamp instead of ingestion time
  if [parsed_message][date] {
    date {
      match => [
        "[parsed_message][date]",
        "yyyy-MM-dd HH:mm:ss",
        "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
      ]
      timezone => "Asia/Kolkata"
      target => "@timestamp"
    }
  } else if [parsed_message][data][timestamp] {
    date {
      match => [
        "[parsed_message][data][timestamp]",
        "yyyy-MM-dd HH:mm:ss",
        "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
      ]
      timezone => "Asia/Kolkata"
      target => "@timestamp"
    }
  }

  # ✅ Flatten fields for easy indexing
  mutate {
    rename => {
      "[parsed_message][service]" => "service"
      "[parsed_message][api]"     => "api"
      "[parsed_message][level]"   => "log_level"
      "[parsed_message][message]" => "log_message"
      "[parsed_message][data]"    => "data"
    }

    remove_field => [
      "host", "agent", "log", "tags",
      "ecs.version", "message",
      "[parsed_message]"
    ]
  }

  # ✅ Cleanup failed date parsing
  if "_dateparsefailure" in [tags] {
    mutate { remove_tag => ["_dateparsefailure"] }
  }
}

output {
  stdout { codec => rubydebug }  # Debug (optional)

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTIC_USERNAME}"
    password => "${ELASTIC_PASSWORD}"
    ecs_compatibility => "v8"
    index => "%{[service]}-%{[api]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
    timeout => 30
    pool_max => 1000
  }
}

#########################################################
# ✅ Summary:
# • Reads logs from Redis queue
# • Parses + cleans + flattens JSON
# • Uses log-created timestamp (@timestamp)
# • Pushes to Elasticsearch with daily indices
# • Keeps unprocessed logs in Redis if ES is down
#########################################################
