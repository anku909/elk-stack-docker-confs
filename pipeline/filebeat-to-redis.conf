#########################################################
# PIPELINE 1: Filebeat → Redis
#########################################################

input {
  beats {
    port => 5044
  }
}

filter {
  # ✅ Parse Filebeat message as JSON safely
  json {
    source => "message"
    target => "parsed"
    skip_on_invalid_json => true
  }

  # ✅ Optionally enrich logs with metadata
  mutate {
    add_field => {
      "source_host" => "%{[host][name]}"
      "raw_message" => "%{message}"
    }
  }
}

output {
  # ✅ Push parsed logs into Redis list (queue)
  redis {
    host => "redis"
    port => 6379
    password => "SuperSecret123"
    data_type => "list"
    key => "filebeat_queue"
    db => 0
    reconnect_interval => 5
  }

  # Debug output for visibility (optional)
  stdout { codec => json_lines }
}

#########################################################
# ✅ Summary:
# • Receives logs from Filebeat
# • Parses JSON
# • Pushes safely into Redis queue
# • Keeps logs if ELK is down (durable buffer)
#########################################################
